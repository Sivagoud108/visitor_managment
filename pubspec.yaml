name: visitor_management
description: Visitor Management mobile app - register visitors, generate/scan QR codes, and record check-in/check-out.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  dio: ^5.4.3+1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.3
  intl: ^0.20.3
  go_router: ^18.1.1
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
